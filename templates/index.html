<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title>SendBox — share files</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d9488'/%3E%3Cpath d='M50 28v26m0 0-9-9m9 9 9-9M34 66h32' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card" id="card">
    <header class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0L7 9m5-5 5 5"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </span>
      <div>
        <h1>SendBox</h1>
        <p class="tagline">Drop files, share instantly.</p>
      </div>
    </header>

    <div class="mode-switch" role="tablist" aria-label="Transfer mode">
      <span class="mode-btn active" aria-current="page">Link sharing</span>
      <a class="mode-btn" href="/p2p">P2P direct</a>
    </div>

    <!-- UPLOAD STATE -->
    <section id="uploadState">
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Upload files">
        <input type="file" id="fileInput" multiple hidden>
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V7m0 0 3.5 3.5M12 7l-3.5 3.5"/>
            <path d="M4 15v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
        </div>
        <p class="drop-title">Drag &amp; drop files here</p>
        <p class="drop-sub">or <span class="link">browse your device</span></p>
        <p class="drop-hint">Any size · files auto-delete</p>
      </div>

      <div id="filePanel" class="file-panel hidden">
        <div class="file-panel-head">
          <span id="fileCount"></span>
          <span id="fileTotal"></span>
          <button id="clearBtn" class="text-btn">Clear</button>
        </div>
        <ul id="fileList" class="filelist"></ul>
      </div>

      <div class="settings">
        <div class="field">
          <span class="field-label">Expires in</span>
          <div class="segmented" id="segExpiry">
            <input type="radio" name="expiry" id="e1" value="1">
            <label for="e1">1h</label>
            <input type="radio" name="expiry" id="e6" value="6">
            <label for="e6">6h</label>
            <input type="radio" name="expiry" id="e24" value="24" checked>
            <label for="e24">24h</label>
            <input type="radio" name="expiry" id="e72" value="72">
            <label for="e72">3d</label>
            <input type="radio" name="expiry" id="e168" value="168">
            <label for="e168">7d</label>
            <input type="radio" name="expiry" id="e0" value="0">
            <label for="e0">∞</label>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Max downloads</span>
          <div class="maxdl-wrap">
            <input id="maxdl" type="number" min="0" placeholder="Unlimited">
            <span class="maxdl-suffix">unlimited</span>
          </div>
        </div>
      </div>

      <button id="uploadBtn" class="btn btn-primary" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <span>Send files</span>
      </button>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress">
          <div id="progressBar"></div>
        </div>
        <div class="progress-meta">
          <span id="progressText">0%</span>
          <span id="progressDetail"></span>
        </div>
      </div>
    </section>

    <!-- RESULT STATE -->
    <section id="resultState" class="hidden">
      <div class="success-ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h2 class="result-title">Files are live</h2>
      <p class="result-sub">Share this link — it expires when the time is up.</p>
      <div class="linkrow">
        <input id="shareUrl" readonly>
        <button id="copyBtn" class="btn btn-ghost" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <div class="result-actions">
        <button id="openBtn" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
          </svg>
          <span>Open</span>
        </button>
        <button id="newBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New transfer</span>
        </button>
      </div>
    </section>

    <footer class="receive">
      <form id="receiveForm" autocomplete="off">
        <div class="field">
          <span class="field-label">Got a link instead?</span>
          <div class="receive-row">
            <input id="keyInput" placeholder="Paste link or key, e.g. AbC123xY">
            <button class="btn btn-ghost" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15V3m0 0 4 4m-4-4-4 4"/>
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
              </svg>
              <span>Receive</span>
            </button>
          </div>
        </div>
      </form>
    </footer>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
