<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SendBox logo">
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#1a1816" />
  <rect width="96" height="96" rx="22" fill="#ff4d12" stroke="#1a1816" stroke-width="4.5"/>
  <!-- retro highlight notch -->
  <path d="M22 18 C22 14 26 10 30 10 H58 C66 10 72 14 74 22" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.32" fill="none"/>
  <!-- box & arrow — double stroke for retro hard outline -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bottom tray black outline -->
    <path d="M22 64 V76 C22 80.5 25 84 29.5 84 H70.5 C75 84 78 80.5 78 76 V64" stroke="#1a1816" stroke-width="10" />
    <!-- arrow stem black outline -->
    <path d="M50 26 V62" stroke="#1a1816" stroke-width="11.5" />
    <!-- arrow head black outline -->
    <path d="M36 41 L50 26 L64 41" stroke="#1a1816" stroke-width="10.5" />
    <!-- white inner -->
    <path d="M22 64 V76 C22 80.5 25 84 29.5 84 H70.5 C75 84 78 80.5 78 76 V64" stroke="white" stroke-width="6.5" />
    <path d="M50 26 V62" stroke="white" stroke-width="7.5" />
    <path d="M36 41 L50 26 L64 41" stroke="white" stroke-width="7" />
  </g>
  <!-- tiny retro star accent -->
  <g fill="white" opacity="0.95">
    <path d="M78 18 l1.4 3.1 3.2 .45 -2.32 2.24 .55 3.18 L78 25.4 75.12 26.97 75.67 23.79 73.35 21.55 76.6 21.1 Z"/>
  </g>
  <g fill="#ffe9a8" opacity="0.9">
    <circle cx="74" cy="78" r="2.2"/>
    <circle cx="80" cy="74" r="1.3"/>
  </g>
</svg>
